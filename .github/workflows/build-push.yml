name: Build & Push Docker Image
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu:latest
    steps:
      - uses: actions/checkout@v7
        name: Clonar repositorio
      - name: Construir imagen
        run: docker build -t sauldiazfonseca/pet-radar-api:latest .
